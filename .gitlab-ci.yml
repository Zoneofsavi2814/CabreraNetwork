workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - test
  - build

default:
  tags:
    - jetson-standard
  interruptible: true

variables:
  GIT_DEPTH: "1"
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "fast"
  CACHE_COMPRESSION_LEVEL: "fastest"

python:test:
  image: python:3.12-slim
  stage: test
  needs: []
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .cache/pip/
  before_script:
    - python -m pip install -r requirements.txt pytest
  script:
    - bash -n scripts/*.sh
    - python -m compileall -q server scripts
    - python -m pytest server -q --junitxml=junit.xml
  artifacts:
    when: always
    reports:
      junit: junit.xml

frontend:build:
  image: node:22-bookworm-slim
  stage: build
  needs: []
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .cache/npm/
  before_script:
    - npm ci --prefer-offline --no-audit --no-fund
  script:
    - npm run build
    - test -s dist/index.html
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
