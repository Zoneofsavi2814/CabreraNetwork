workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - test
  - build
  - deploy

default:
  tags:
    - jetson-standard
  interruptible: true

variables:
  GIT_DEPTH: "1"
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "fast"
  CACHE_COMPRESSION_LEVEL: "fastest"

python:test:
  image: python:3.12-slim
  stage: test
  needs: []
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .cache/pip/
  before_script:
    - python -m pip install -r requirements.txt pytest
  script:
    - bash -n scripts/*.sh
    - python -m compileall -q server scripts
    - python -m pytest server -q --junitxml=junit.xml
  artifacts:
    when: always
    reports:
      junit: junit.xml

frontend:build:
  image: node:22-bookworm-slim
  stage: build
  needs: []
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .cache/npm/
  before_script:
    - npm ci --prefer-offline --no-audit --no-fund
  script:
    - npm run build
    - test -s dist/index.html
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

deploy:rp4-dashboard:
  stage: deploy
  tags:
    - jetson-deploy
  needs:
    - job: python:test
      artifacts: false
    - job: frontend:build
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - when: never
  resource_group: rp4
  interruptible: false
  timeout: 30m
  variables:
    PI4_DEPLOY_DIR: "/home/pi4/cabrera-network-deploy/CabreraNetwork"
  environment:
    name: production/rp4-dashboard
    url: http://192.168.0.101/
  script:
    - test -s dist/index.html
    - ssh rp4 "sudo -n true && install -d -m 0755 '$PI4_DEPLOY_DIR'"
    - >-
      rsync -az --delete
      --exclude='.git/'
      --exclude='node_modules/'
      --exclude='.cache/'
      --exclude='.npm/'
      "$CI_PROJECT_DIR/"
      "rp4:$PI4_DEPLOY_DIR/"
    - ssh rp4 "cd '$PI4_DEPLOY_DIR' && test -s dist/index.html && ./scripts/install-pi.sh"
    - ssh rp4 'sudo -n systemctl is-active --quiet pi4-noc.service'
    - |
      ready=0
      for attempt in $(seq 1 30); do
        if curl -fsS http://192.168.0.101/ >/dev/null; then
          ready=1
          break
        fi
        sleep 2
      done
      test "$ready" = 1
    - curl -fsS http://192.168.0.101/api/session | jq -e '.authenticated == false and .user == null' >/dev/null
    - test "$(curl -sS -o /dev/null -w '%{http_code}' http://192.168.0.101/api/snapshot)" = 401
    - |
      local_sha="$(sha256sum dist/index.html | cut -d ' ' -f 1)"
      remote_sha="$(ssh rp4 "sha256sum /opt/pi4-noc/dist/index.html | cut -d ' ' -f 1")"
      test "$local_sha" = "$remote_sha"
