# CabreraNetwork - shell-runner CI for Raspberry Pi 5
# Runner: GitLab shell executor tagged `rp5`

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - check
  - test
  - build

default:
  tags:
    - rp5
  interruptible: true

variables:
  GIT_DEPTH: "50"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"

cache:
  key:
    files:
      - package-lock.json
      - requirements.txt
  paths:
    - .cache/npm/
    - .cache/pip/
    - node_modules/

preflight:shell-runner:
  stage: check
  script:
    - set -eu
    - echo "Runner ${CI_RUNNER_DESCRIPTION:-local} on ${CI_RUNNER_EXECUTABLE_ARCH:-unknown-arch}"
    - command -v git
    - command -v python3
    - command -v node
    - command -v npm
    - python3 --version
    - node --version
    - npm --version
    - |
      for forbidden in '^[[:space:]]*image:' 'a[p]k[[:space:]]+add' 'apt-get[[:space:]]' 'd[o]cker[[:space:]]'; do
        if grep -nE "$forbidden" .gitlab-ci.yml; then
          echo "Unsupported shell-runner setup found in .gitlab-ci.yml" >&2
          exit 1
        fi
      done

text:check:
  stage: check
  script:
    - |
      python3 - <<'PY'
      from pathlib import Path
      import sys

      failures = []

      for path in [".gitlab-ci.yml"]:
          data = Path(path).read_bytes()
          if b"\r\n" in data or b"\r" in data:
              failures.append(f"{path}: CRLF line ending")
          for number, line in enumerate(data.splitlines(), start=1):
              if line.rstrip(b" \t") != line:
                  failures.append(f"{path}:{number}: trailing whitespace")

      if failures:
          print("\n".join(failures))
          sys.exit(1)

      print("Checked .gitlab-ci.yml text hygiene.")
      PY
    - |
      if [ -n "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-}" ]; then
        git fetch --no-tags --depth=50 origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        git diff --check "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD"
      elif [ -n "${CI_COMMIT_BEFORE_SHA:-}" ] && [ "${CI_COMMIT_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
        git diff --check "$CI_COMMIT_BEFORE_SHA" "$CI_COMMIT_SHA"
      else
        echo "No CI diff base available; checked CI config only."
      fi

python:syntax:
  stage: check
  script:
    - python3 -m compileall -q server scripts
    - python3 -m py_compile server/app.py server/sudo_ops.py server/tplink_collector.py

shell:check:
  stage: check
  script:
    - bash -n scripts/install-pi.sh
    - |
      if command -v shellcheck >/dev/null 2>&1; then
        shellcheck -x scripts/install-pi.sh
      else
        echo "shellcheck is not installed; bash syntax check passed."
      fi

html:check:
  stage: check
  script:
    - node -e "const fs=require('fs'); const html=fs.readFileSync('index.html','utf8'); if(!/<\/html>/i.test(html)) process.exit(1);"
    - echo "index.html smoke check passed."

python:test:
  stage: test
  script:
    - python3 -m unittest discover -s server -p 'test_*.py' -v

frontend:build:
  stage: build
  script:
    - npm ci --no-audit --no-fund --prefer-offline
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
