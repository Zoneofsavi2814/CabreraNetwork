apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: observability
  labels:
    app: uptime-kuma
    homelab.cabrera.dev/role: monitoring
    homelab.cabrera.dev/tier: observability
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
        homelab.cabrera.dev/role: monitoring
        homelab.cabrera.dev/tier: observability
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: raspberrypi5
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: uptime-kuma
          image: docker.io/louislam/uptime-kuma@sha256:e4d212bee31351791b96feca913f3dff73e4bfd42a1821a39308d67077c6eb15
          imagePullPolicy: IfNotPresent
          ports:
            - name: web
              containerPort: 3001
              hostPort: 3001
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: uptime-kuma-data
              mountPath: /app/data
      volumes:
        - name: uptime-kuma-data
          hostPath:
            # Directory, rather than DirectoryOrCreate, prevents an accidental
            # empty Kuma instance when migration data has not been prepared.
            path: /var/lib/uptime-kuma
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: observability
  labels:
    app: uptime-kuma
spec:
  type: ClusterIP
  selector:
    app: uptime-kuma
  ports:
    - name: web
      port: 3001
      targetPort: web
      protocol: TCP
