apiVersion: v1
kind: Namespace
metadata:
  name: homelab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-smoke
  namespace: homelab
  labels:
    app: homelab-smoke
    homelab.cabrera.dev/role: smoke-test
    homelab.cabrera.dev/tier: synthetic
  annotations:
    homelab.cabrera.dev/containerd-target-digest: sha256:9834000db9dff07b7ee301ce14ab43b7d249ec11d5d4ad83e3bd39d0751e4446
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: homelab-smoke
  template:
    metadata:
      labels:
        app: homelab-smoke
        homelab.cabrera.dev/role: smoke-test
        homelab.cabrera.dev/tier: synthetic
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: pi4
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # This exact cache-only artifact must be exported before a rebuild or
          # k3s update. The verified target digest is recorded above.
          image: localhost/homelab-smoke:dev-001
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: homelab-smoke
  namespace: homelab
  labels:
    app: homelab-smoke
spec:
  type: ClusterIP
  selector:
    app: homelab-smoke
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-registry
  namespace: homelab
  labels:
    app: local-registry
    homelab.cabrera.dev/role: registry
    homelab.cabrera.dev/tier: platform
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: local-registry
  template:
    metadata:
      labels:
        app: local-registry
        homelab.cabrera.dev/role: registry
        homelab.cabrera.dev/tier: platform
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: pi4
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: docker.io/library/registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          imagePullPolicy: IfNotPresent
          env:
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
          ports:
            - name: registry
              containerPort: 5000
              hostPort: 5000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /v2/
              port: registry
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v2/
              port: registry
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry
      volumes:
        - name: registry-data
          hostPath:
            path: /mnt/ssd/registry
            # Provisioned by host maintenance; fail closed if the data HDD is
            # absent instead of creating registry storage on the root card.
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: local-registry
  namespace: homelab
  labels:
    app: local-registry
spec:
  type: ClusterIP
  selector:
    app: local-registry
  ports:
    - name: registry
      port: 5000
      targetPort: registry
      protocol: TCP
